*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f)}
h1,h2,h3{font-family:var(--fd);line-height:1.2;margin:0 0 10px}

a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.sr{position:absolute;left:-9999px}
/* layout */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--brand);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.side img{width:150px;margin:2px 6px 14px}
.side nav{display:grid;gap:4px}

.side .cnt{background:rgba(255,255,255,.18);border-radius:99px;font-size:12px;padding:1px 8px}
.side .foot{margin-top:auto;font-size:12px;color:#aaa6d8;padding:6px}
main{padding:24px clamp(14px,3vw,36px) 60px;min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side img{width:110px;margin:0 8px 0 0}.side nav{display:flex;flex-wrap:wrap}.side .foot{display:none}}
/* ui */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;text-decoration:none}

.btn.line{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.dark{background:var(--brand)}
.btn.ok{background:#1b9f5c}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:14px}
.kpi b{display:block;font:800 1.7rem var(--fd)}
.kpi span{color:var(--muted);font-size:13px}
.kpi.warn{border-top-color:var(--warn)}.kpi.bad{border-top-color:var(--danger)}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fld{margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--wash);color:var(--brand);white-space:nowrap}
.st-0{background:#e9e7fb}.st-1{background:#fde7f3;color:#a40058}.st-2{background:#fff0d6;color:#8a5200}.st-3{background:#dff0ff;color:#0b5aa6}.st-4{background:#ffe3df;color:#a3281b}.st-5{background:#dcf5e7;color:#14693f}.st-6{background:#e8e8ee;color:#555}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th,.tb td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tb th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tb tr.clk{cursor:pointer}.tb tr.clk:hover{background:var(--wash)}
.tbw{overflow-x:auto}
.late{color:var(--danger);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a[aria-current=page]{color:var(--brand);border-bottom-color:var(--accent)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:13.5px}
.bar i{display:block;height:14px;background:var(--wash);border-radius:7px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--accent);border-radius:7px}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--wash);border-radius:12px;padding:10px;min-height:140px}
.col h3{display:flex;justify-content:space-between;font-size:.9rem}
.col.over{outline:2px dashed var(--accent)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:13.5px}
.kc b{display:block}
.kc .m{color:var(--muted);font-size:12.5px}
/* diagnostic */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{position:relative;margin:0;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;background:#fff;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}
.seg input:checked+span{display:block}
.seg label:has(input:checked){background:var(--brand);color:#fff}
.seg label.l0:has(input:checked){background:#b3261e}.seg label.l1:has(input:checked){background:#b26a00}.seg label.l2:has(input:checked){background:#1b7a4b}
.need{display:grid;grid-template-columns:200px auto 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:760px){.need{grid-template-columns:1fr}}
.reco{border:2px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.reco.top{border-color:var(--accent)}
/* devis builder */
.qgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.qgrid{grid-template-columns:1fr}}
.qopt{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:#fff;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:400;margin-bottom:6px}
.qopt:has(input:checked){border-color:var(--accent);background:var(--wash)}
.qopt input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.qopt .n{flex:1}.qopt .p{font-weight:800;white-space:nowrap}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font:700 12px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 0 6px}

.sum .l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}

.sheet{font-size:14px;color:#111}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:16px}

.sheet h2{font-size:1.5rem;color:var(--brand)}
.sheet table{width:100%;border-collapse:collapse;margin:12px 0}

.empty{text-align:center;padding:30px;color:var(--muted)}
.hist li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist{list-style:none;margin:0;padding:0}
@media print{
  body{background:#fff}

  .modal .box{max-width:none;padding:0;box-shadow:none;margin:0}

-muted)}.small{font-size:14px}\n.prog{height:12px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin:12px 0 4px}.prog i{display:block;height:100%;background:#FF6BB8;border-radius:99px}\n.hero .big{font:800 2.2rem var(--fd)}\n.next{display:grid;gap:6px}.next .d{font:800 1.3rem var(--fd);color:var(--brand)}\n.li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.li:last-child{border-bottom:0}\n.li .l{flex:1 1 260px;min-width:0}.li .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--wash);color:var(--brand);white-space:nowrap}\n.tag.ok{background:#dff5e8;color:#14683f}.tag.doing{background:#fff0d6;color:#8a5200}.tag.todo{background:#ecebf5;color:#55527a}.tag.done{background:#dff0ff;color:#0b5aa6}.tag.no{background:#ffe3df;color:#a3281b}\nlabel{display:block;font-weight:600;margin:10px 0 4px}\ninput,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}textarea{min-height:84px}\n.scale{display:flex;gap:6px;flex-wrap:wrap}.scale label{margin:0;font-weight:600;position:relative}\n.scale input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}.scale span{display:grid;place-items:center;min-width:42px;height:42px;border:2px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}\n.scale input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}.scale input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}\n.lock{text-align:center;padding:26px}.msg{padding:12px 14px;border-radius:12px;background:var(--wash);margin:10px 0}\n.ok-box{background:#dff5e8;color:#14683f;border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600}\nfooter{text-align:center;color:var(--muted) function applyRetour(a,o){
  var n=0,sat=false;
  Object.keys(o.fb||{}).forEach(function(id){
    var l=null;a.liv.forEach(function(x){if(x.id===id)l=x;});if(!l)return;
    var f=o.fb[id];if(!f||(f.state!=='ok'&&f.state!=='revoir'))return;
    if(f.rev!==undefined&&(f.rev||0)!==(l.rev||0))return; /* réponse donnée sur une ancienne version du livrable */
    l.fb={state:f.state,comment:String(f.comment||'').slice(0,1000),date:o.date||today()};
    if(f.state==='ok'&&l.status==='done')l.status='ok';
    if(f.state==='revoir'&&(l.status==='ok'||l.status==='done'))l.status='doing';
    n++;
  });
  var q=o.sat;
  if(q&&q.q1&&q.q3&&q.q4!==undefined&&q.q2&&!a.sat.resp){
    a.sat.resp={date:o.date||today(),q1:+q.q1,q2:String(q.q2),q3:+q.q3,q4:+q.q4,q5:String(q.q5||'').slice(0,1500),q6:String(q.q6||'').slice(0,1500),q7:!!q.q7};
    sat=true;
  }
  a.retours.push({date:o.date||today(),livrables:n,sat:sat});
  return {n:n,sat:sat};
}
function importRetour(txt){
  var m=/GSC-RETOUR:([A-Za-z0-9_\-+\/=]+)/.exec(String(txt||''));
  if(!m)return {err:'Je ne trouve pas le code « GSC-RETOUR » dans ce message.'};
  var o;try{o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));}catch(e){return {err:'Le code est abîmé. Demandez au client de recopier le message complet.'};}
  var a=getAcc(o&&o.accId);if(!a)return {err:'Ce retour ne correspond à aucun accompagnement de cette plateforme.'};
  var r=applyRetour(a,o);
  save();return {acc:a,n:r.n,sat:r.sat};
}

function svcOn(){var s=S.settings;return /^https?:\/\/\S+$/.test(String(s.svcUrl||'').trim())&&String(s.svcKey||'').trim().length>=8;}

function newToken(){var b=new Uint8Array(24);(window.crypto||window.msCrypto).getRandomValues(b);var t='';for(var i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

function svcErr(m){return ({CODE_NON_MODIFIE:'Le code secret n’a pas été changé dans le script Google.','CODE_TROP_COURT':'Le code secret du script est trop court.','code incorrect':'Le code secret ne correspond pas à celui du script.',LIEN_INVALIDE:'Lien invalide.','espace trop volumineux':'Cet espace est trop volumineux (trop de texte).','action inconnue':'Le script Google n’est pas à jour : collez la nouvelle version puis « Nouvelle version » dans le déploiement.'})[m]||('Réponse du service : '+m);}

function pushAcc(a,force){

function pull(manual){
  if(!svcOn()||ui.pulling)return Promise.resolve();

    ui.pulling=false;
    if(r.status!=='ok'){setNet('err',svcErr(r.message));if(manual)toast(svcErr(r.message));return;}

      if(e.etat==='actif'&&a.espace.etat==='invité'){

      }
      a.espace.seen=a.espace.seen||[];var nf=0,ns=false;

      if(nf||ns)msgs.push('retour de '+a.client.nom+(nf?' ('+nf+' livrable'+(nf>1?'s':'')+')':'')+(ns?' + questionnaire':''));
      if(a.espace.seen.length>100)a.espace.seen=a.espace.seen.slice(-100);

    setNet('ok');if(manual)toast('Rien de nouveau.');

}

function nav(r){
  var items=[['dash','Tableau de bord','#/',''],['acc','Accompagnements','#/acc',S.acc.filter(function(a){return a.statut==='actif';}).length],['agenda','Agenda','#/agenda',''],['set','Réglages','#/set','']];
  return items.map(function(i){var cur=(r.v===i[0]||(i[0]==='acc'&&r.v==='a'))?' aria-current="page"':'';return '<a class="nv" href="'+i[2]+'"'+cur+'>'+i[1]+(i[3]!==''?'<span class="cnt">'+i[3]+'</span>':'')+'</a>';}).join('');
}
function shell(r,body){
  return '<div class="app"><aside class="side noprint"><img src="'+LOGO_D+'" alt="GSC Business Center"><nav aria-label="Navigation">'+nav(r)+'</nav><div class="foot">Plateforme d’accompagnement<br>Les données restent dans ce navigateur. Pensez à exporter une sauvegarde (Réglages).</div>'+netBadge()+'</aside><main id="main">'+body+'</main></div>'+ui.modal;
}
function render(){
  var root=$('#root');
  if(hasPin()&&!unlocked){root.innerHTML=lockView();return;}
  var r=route(),b='';
  if(r.v==='dash')b=viewDash();else if(r.v==='acc')b=viewList();else if(r.v==='agenda')b=viewAgenda();else if(r.v==='set')b=viewSet();else if(r.v==='a')b=viewAcc(r.id,r.tab);else b=viewDash();
  root.innerHTML=shell(r,b);
  document.title='Accompagnement · '+(S.settings.cabinet||'GSC');
}
function hasPin(){try{return !!localStorage.getItem(KEYPIN);}catch(e){return false;}}
function lockView(){return '<div class="lockbox"><img src="'+LOGO_L+'" alt="GSC" style="width:150px"><h1 style="margin-top:12px">Accès protégé</h1><p class="muted">Saisissez votre code d’accès.</p><form data-form="unlock"><div class="fld"><label for="pin" class="sr">Code</label><input id="pin" type="password" autocomplete="current-password" autofocus></div><button class="btn" type="submit">Ouvrir</button><p id="pinmsg" class="late small" role="alert"></p></form></div>';}
function tag(c,t){return '<span class="tag '+c+'">'+esc(t)+'</span>';}
function upcoming(days){
  var t=today(),lim=addDays(t,days),out=[];
  S.acc.forEach(function(a){if(a.statut==='terminé')return;a.rdv.forEach(function(r){if(r.statut==='prévu'&&r.date>=t&&r.date<=lim)out.push({a:a,r:r});});});
  out.sort(function(x,y){return (x.r.date+x.r.time)<(y.r.date+y.r.time)?-1:1;});return out;
}
function late(){var t=today(),o=[];S.acc.forEach(function(a){if(a.statut==='terminé')return;a.rdv.forEach(function(r){if(r.statut==='prévu'&&r.date<t)o.push({a:a,r:r});});});return o;}
function viewDash(){
  var act=S.acc.filter(function(a){return a.statut==='actif';}),up=upcoming(7),lt=late();
  var toVal=0,sats=[],wait=0,fix=[];
  S.acc.forEach(function(a){a.liv.forEach(function(l){if(l.status==='done')toVal++;if(l.fb&&l.fb.state==='revoir'&&l.status!=='ok')fix.push({a:a,l:l});});if(a.sat.resp)sats.push(a.sat.resp);if(a.statut!=='terminé'&&satOpen(a)&&!a.sat.resp)wait++;});
  var avg=sats.length?Math.round(sats.reduce(function(s,r){return s+satScore(r);},0)/sats.length*10)/10:null;
  var prom=sats.filter(function(r){return r.q4>=9;}).length,det=sats.filter(function(r){return r.q4<=6;}).length,nps=sats.length?Math.round((prom-det)/sats.length*100):null;
  var h='<div class="top"><h1>Tableau de bord</h1><div class="acts"><button class="btn" data-act="new">Nouvel accompagnement</button><button class="btn dark" data-act="invite">Inviter un client</button><button class="btn line" data-act="import">Importer un retour client</button></div></div>';
  if(!S.acc.length)return h+'<div class="card empty"><h2>Bienvenue dans votre plateforme d’accompagnement</h2><p>Ici, vous suivez chaque client : rendez-vous, livrables et questionnaire de satisfaction. Chaque client reçoit son propre espace.</p><div class="row" style="justify-content:center"><button class="btn" data-act="new">Créer mon premier accompagnement</button><button class="btn dark" data-act="invite">Inviter un client</button><button class="btn line" data-act="demo">Voir un exemple</button></div></div>';
  h+='<div class="kpis"><div class="kpi"><b>'+act.length+'</b><span>accompagnements en cours</span></div><div class="kpi"><b>'+up.length+'</b><span>rendez-vous dans les 7 jours</span></div><div class="kpi'+(lt.length?' bad':'')+'"><b>'+lt.length+'</b><span>rendez-vous en retard</span></div><div class="kpi'+(toVal?' warn':'')+'"><b>'+toVal+'</b><span>livrables à faire valider</span></div><div class="kpi"><b>'+wait+'</b><span>questionnaires attendus</span></div><div class="kpi"><b>'+(avg===null?'—':avg+'/10')+'</b><span>satisfaction moyenne'+(nps===null?'':' · recommandation '+(nps>0?'+':'')+nps)+'</span></div></div>';
  h+='<div class="grid g2"><div class="card"><h2>Rendez-vous des 7 prochains jours</h2>'+(up.length?up.map(function(x){return '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span><b>'+esc(fd(x.r.date,true))+' '+esc(x.r.time)+'</b> · '+esc(x.r.title)+'<br><a href="#/a/'+x.a.id+'/rdv">'+esc(x.a.client.nom)+'</a></span><a class="btn sm line" target="_blank" rel="noopener noreferrer" href="'+esc(wa(x.a.client.tel,msgRdv(x.a,x.r))||'#')+'">Rappel WhatsApp</a></div>';}).join(''):'<p class="muted">Rien de prévu cette semaine.</p>')+'</div>'+
  '<div class="card"><h2>À traiter</h2>'+(lt.length||toVal||wait||fix.length||S.acc.some(function(a){return a.espace&&a.espace.etat==='invité';})?'<ul style="margin:0;padding-left:18px">'+fix.map(function(x){return '<li class="late">À corriger demandé par le client : <a href="#/a/'+x.a.id+'/livrables">'+esc(x.a.client.nom)+' · '+esc(x.l.title)+'</a></li>';}).join('')+lt.map(function(x){return '<li class="late">Rendez-vous passé non clôturé : <a href="#/a/'+x.a.id+'/rdv">'+esc(x.a.client.nom)+' · '+esc(x.r.title)+' ('+esc(fd(x.r.date,true))+')</a></li>';}).join('')+S.acc.map(function(a){var n=a.liv.filter(function(l){return l.status==='done';}).length;return n?'<li>'+n+' livrable(s) livré(s), en attente du client : <a href="#/a/'+a.id+'/livrables">'+esc(a.client.nom)+'</a></li>':'';}).join('')+S.acc.map(function(a){return (a.espace&&a.espace.etat==='invité')?'<li>Invitation en attente de réponse : <a href="#/a/'+a.id+'/client">'+esc(a.client.nom)+'</a></li>':'';}).join('')+S.acc.map(function(a){return (a.statut!=='terminé'&&satOpen(a)&&!a.sat.resp)?'<li>Questionnaire à demander : <a href="#/a/'+a.id+'/satisfaction">'+esc(a.client.nom)+'</a></li>':'';}).join('')+'</ul>':'<p class="muted">Tout est à jour.</p>')+'</div></div>';
  h+='<div class="card"><h2>Accompagnements en cours</h2>'+listTable(act)+'</div>';
  return h;
}
function listTable(list){
  if(!list.length)return '<p class="muted">Aucun accompagnement.</p>';
  return '<div class="tbw"><table class="tb"><thead><tr><th>Client</th><th>Projet</th><th>Avancement</th><th>Prochain RDV</th><th>Statut</th></tr></thead><tbody>'+list.map(function(a){
    var c=cat(a.projet),t=today(),nx=a.rdv.filter(function(r){return r.statut==='prévu';}).sort(function(x,y){return x.date<y.date?-1:1;})[0];
    return '<tr class="clk" data-go="#/a/'+a.id+'/resume"><td><b>'+esc(a.client.nom)+'</b>'+(a.espace&&a.espace.etat==='invité'?' '+tag('todo','invitation envoyée'):'')+(a.client.entreprise?'<br><span class="muted small">'+esc(a.client.entreprise)+'</span>':'')+'</td><td>'+esc(c.code)+' · '+esc(c.name)+'</td><td style="min-width:130px"><div class="pbar"><i style="width:'+prog(a)+'%"></i></div><span class="small muted">'+prog(a)+' % · phase '+a.phase+'/'+c.phases+'</span></td><td>'+(nx?'<span'+(nx.date<t?' class="late"':'')+'>'+esc(fd(nx.date,true))+' '+esc(nx.time)+'</span>':'<span class="muted">—</span>')+'</td><td>'+tag(a.statut==='actif'?'doing':a.statut==='terminé'?'ok':'todo',ST[a.statut])+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function viewList(){
  var q=ui.q.toLowerCase(),fs=ui.fs;
  var list=S.acc.filter(function(a){return (fs==='tous'||a.statut===fs)&&(!q||(a.client.nom+' '+a.client.entreprise+' '+cat(a.projet).name).toLowerCase().indexOf(q)>-1);});
  return '<div class="top"><h1>Accompagnements</h1><div class="acts"><button class="btn" data-act="new">Nouvel accompagnement</button><button class="btn dark" data-act="invite">Inviter un client</button></div></div><div class="card"><div class="row" style="margin-bottom:12px"><div style="flex:1 1 220px"><label for="q" class="sr">Rechercher</label><input id="q" type="search" placeholder="Rechercher un client ou un projet" value="'+esc(ui.q)+'" data-search></div><div><label for="fs" class="sr">Statut</label><select id="fs" data-fs>'+[['actif','En cours'],['pause','En pause'],['terminé','Terminés'],['tous','Tous']].map(function(o){return '<option value="'+o[0]+'"'+(fs===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div></div>'+listTable(list)+'</div>';
}
function viewAgenda(){
  var t=today(),all=[];
  S.acc.forEach(function(a){if(a.statut==='terminé')return;a.rdv.forEach(function(r){if(r.statut==='prévu')all.push({a:a,r:r});});});
  all.sort(function(x,y){return (x.r.date+x.r.time)<(y.r.date+y.r.time)?-1:1;});
  var groups=[['En retard',all.filter(function(x){return x.r.date<t;})],['Aujourd’hui',all.filter(function(x){return x.r.date===t;})],['Cette semaine',all.filter(function(x){return x.r.date>t&&x.r.date<=addDays(t,7);})],['Plus tard',all.filter(function(x){return x.r.date>addDays(t,7);})]];
  return '<div class="top"><h1>Agenda</h1><div class="acts"><button class="btn line" data-act="ics-all"'+(all.length?'':' disabled')+'>Exporter vers mon agenda (.ics)</button></div></div>'+(all.length?groups.map(function(g){return g[1].length?'<div class="card"><h2'+(g[0]==='En retard'?' class="late"':'')+'>'+g[0]+'</h2>'+g[1].map(function(x){return '<div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span><b>'+esc(fd(x.r.date))+' à '+esc(x.r.time)+'</b> · '+esc(x.r.title)+'<br><a href="#/a/'+x.a.id+'/rdv">'+esc(x.a.client.nom)+'</a> <span class="muted small">· '+esc(x.r.mode)+(x.r.lieu?' · '+esc(x.r.lieu):'')+'</span></span><span class="row"><button class="btn sm line" data-act="ics-one" data-a="'+x.a.id+'" data-i="'+x.r.id+'">.ics</button><a class="btn sm" target="_blank" rel="noopener noreferrer" href="'+esc(wa(x.a.client.tel,msgRdv(x.a,x.r))||'#')+'">WhatsApp</a></span></div>';}).join('')+'</div>':'';}).join(''):'<div class="card empty">Aucun rendez-vous prévu.</div>');
}
function fld(a,kind,item,f,label,val,o){
  o=o||{};var id='f'+Math.random().toString(36).slice(2,8);
  var at=' data-k="'+kind+'" data-a="'+a.id+'" data-i="'+(item||'')+'" data-f="'+f+'"'+(o.rr?' data-rr="1"':'');
  var inner;
  if(o.sel)inner='<select id="'+id+'"'+at+'>'+o.sel.map(function(x){return '<option value="'+esc(x[0])+'"'+(String(x[0])===String(val)?' selected':'')+'>'+esc(x[1])+'</option>';}).join('')+'</select>';
  else if(o.area)inner='<textarea id="'+id+'"'+at+' rows="'+(o.rows||3)+'">'+esc(val)+'</textarea>';
  else inner='<input id="'+id+'" type="'+(o.type||'text')+'"'+at+' value="'+esc(val)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>';
  return '<div class="fld'+(o.w2?' w2':'')+'"><label for="'+id+'">'+esc(label)+'</label>'+inner+'</div>';
}
function viewAcc(id,tab){
  var a=getAcc(id);if(!a)return '<div class="card empty">Accompagnement introuvable. <a href="#/acc">Retour à la liste</a></div>';
  var c=cat(a.projet),p=prog(a);
  var tabs=[['resume','Résumé'],['rdv','Rendez-vous ('+a.rdv.length+')'],['livrables','Livrables ('+a.liv.length+')'],['satisfaction','Satisfaction'],['client','Espace client']];
  var h='<div class="hd2"><div><div class="meta"><a href="#/acc">← Accompagnements</a></div><h1>'+esc(a.client.nom)+'</h1><div class="meta">'+esc(c.code)+' · '+esc(c.name)+(a.client.entreprise?' · '+esc(a.client.entreprise):'')+' · démarré le '+esc(fd(a.start))+'</div></div><div style="min-width:220px;flex:0 1 300px"><div class="row" style="justify-content:space-between"><b>'+p+' %</b><span class="small muted">phase '+a.phase+' sur '+c.phases+'</span></div><div class="pbar"><i style="width:'+p+'%"></i></div><div style="margin-top:6px">'+tag(a.statut==='actif'?'doing':a.statut==='terminé'?'ok':'todo',ST[a.statut])+'</div></div></div>';
  h+='<div class="tabs" role="tablist">'+tabs.map(function(t){return '<a href="#/a/'+a.id+'/'+t[0]+'"'+(t[0]===tab?' aria-current="page"':'')+'>'+t[1]+'</a>';}).join('')+'</div>';
  if(a.espace&&a.espace.etat==='invité')h+='<div class="card" style="border-color:var(--accent)"><b>Invitation envoyée.</b> <span class="muted">Le client n’a pas encore activé son espace. Son nom et ses coordonnées arriveront automatiquement.</span> <a href="#/a/'+a.id+'/client">Voir le lien</a></div>';
  if(tab==='rdv')h+=tabRdv(a);else if(tab==='livrables')h+=tabLiv(a);else if(tab==='satisfaction')h+=tabSat(a);else if(tab==='client')h+=tabClient(a);else h+=tabResume(a);
  return h;
}
function tabResume(a){
  var c=cat(a.projet),max=c.phases;
  return '<div class="grid g2"><div class="card"><h2>Fiche client</h2>'+fld(a,'client','','nom','Nom',a.client.nom,{rr:1})+fld(a,'client','','entreprise','Entreprise',a.client.entreprise)+fld(a,'client','','tel','Téléphone / WhatsApp',a.client.tel,{ph:'+221 77 000 00 00'})+fld(a,'client','','email','E-mail',a.client.email)+
  '<div class="row">'+(a.client.tel?'<a class="btn sm" target="_blank" rel="noopener noreferrer" href="'+esc(wa(a.client.tel,'Bonjour '+first(a)+', '))+'">WhatsApp</a>':'')+(a.client.email?'<a class="btn sm line" href="mailto:'+esc(a.client.email)+'">E-mail</a>':'')+'</div></div>'+
  '<div class="card"><h2>Suivi</h2>'+fld(a,'acc','','statut','Statut',a.statut,{sel:[['actif','En cours'],['pause','En pause'],['terminé','Terminé']],rr:1})+fld(a,'acc','','consultant','Consultant',a.consultant)+fld(a,'acc','','start','Date de démarrage',a.start,{type:'date'})+
  '<label>Phase du projet</label><div class="row"><button class="btn sm line" data-act="phase" data-d="-1" data-a="'+a.id+'" aria-label="Phase précédente"'+(a.phase<=1?' disabled':'')+'>−</button><b>Phase '+a.phase+' sur '+max+'</b><button class="btn sm line" data-act="phase" data-d="1" data-a="'+a.id+'" aria-label="Phase suivante"'+(a.phase>=max?' disabled':'')+'>+</button></div><p class="muted small">Le questionnaire de satisfaction s’ouvre automatiquement à la dernière phase.</p></div></div>'+
  '<div class="card"><h2>Notes du consultant</h2><p class="muted small">Privées : elles ne sont jamais visibles dans l’espace client.</p>'+fld(a,'acc','','notes','Notes',a.notes,{area:1,rows:5})+'</div>'+
  '<div class="card"><h2>Projet</h2><p><b>'+esc(c.name)+'</b> · '+esc(c.family)+' · durée maximale '+esc(c.dur)+' ('+c.days+' jours) · '+c.price.toLocaleString('fr-FR')+' FCFA'+(c.monthly?' / mois':'')+'</p><button class="btn danger sm" data-act="del-acc" data-a="'+a.id+'">Supprimer cet accompagnement</button></div>';
}
function tabRdv(a){
  var rs=a.rdv.slice().sort(function(x,y){return (x.date+x.time)<(y.date+y.time)?-1:1;});
  return '<div class="row" style="margin-bottom:12px"><button class="btn" data-act="add-rdv" data-a="'+a.id+'">Ajouter un rendez-vous</button>'+(safeUrl(S.settings.calendly)?'<a class="btn line" target="_blank" rel="noopener noreferrer" href="'+esc(safeUrl(S.settings.calendly))+'">Mon lien Calendly</a>':'')+'</div>'+(rs.length?rs.map(function(r){
    return '<div class="blk"><div class="row" style="justify-content:space-between"><b>'+esc(r.title)+'</b>'+tag(r.statut==='fait'?'ok':r.statut==='annulé'?'no':(r.date<today()?'no':'doing'),r.statut==='prévu'&&r.date<today()?'prévu (passé)':r.statut)+'</div><div class="g" style="margin-top:8px">'+
    fld(a,'rdv',r.id,'title','Titre',r.title,{w2:1})+fld(a,'rdv',r.id,'date','Date',r.date,{type:'date',rr:1})+fld(a,'rdv',r.id,'time','Heure',r.time,{type:'time'})+fld(a,'rdv',r.id,'dur','Durée (min)',r.dur,{type:'number'})+
    fld(a,'rdv',r.id,'mode','Mode',r.mode,{sel:[['Visio','Visio'],['Présentiel','Présentiel'],['Téléphone','Téléphone'],['WhatsApp','WhatsApp']]})+fld(a,'rdv',r.id,'lieu','Lien de la visio ou lieu',r.lieu,{w2:1,ph:'https://meet.google.com/…'})+fld(a,'rdv',r.id,'statut','Statut',r.statut,{sel:[['prévu','Prévu'],['fait','Fait'],['annulé','Annulé']],rr:1})+'</div>'+
    fld(a,'rdv',r.id,'cr','Compte rendu (visible par le client)',r.cr,{area:1,rows:2})+
    '<div class="row"><a class="btn sm" target="_blank" rel="noopener noreferrer" href="'+esc(wa(a.client.tel,msgRdv(a,r))||'#')+'">Rappel WhatsApp</a><button class="btn sm line" data-act="ics-one" data-a="'+a.id+'" data-i="'+r.id+'">Agenda (.ics)</button><button class="btn sm danger" data-act="del-rdv" data-a="'+a.id+'" data-i="'+r.id+'">Supprimer</button></div></div>';}).join(''):'<div class="card empty">Aucun rendez-vous. Ajoutez le premier.</div>');
}
function tabLiv(a){
  return '<div class="row" style="margin-bottom:12px"><button class="btn" data-act="add-liv" data-a="'+a.id+'">Ajouter un livrable</button></div><p class="muted small">Collez le lien du fichier (Google Drive, par exemple). Le client ne voit le lien que lorsque le livrable est « Livré » ou « Validé ».</p>'+(a.liv.length?a.liv.map(function(l){
    var fb=l.fb?'<div class="quote small">Retour du client ('+esc(fd(l.fb.date,true))+') : <b>'+(l.fb.state==='ok'?'il convient':'à revoir')+'</b>'+(l.fb.comment?' — « '+esc(l.fb.comment)+' »':'')+'</div>':'';
    return '<div class="blk"><div class="row" style="justify-content:space-between"><b>'+esc(l.title)+'</b>'+tag(l.status,LS[l.status])+'</div><div class="g" style="margin-top:8px">'+fld(a,'liv',l.id,'title','Livrable',l.title,{w2:1})+fld(a,'liv',l.id,'status','Statut',l.status,{sel:[['todo','À faire'],['doing','En cours'],['done','Livré'],['ok','Validé par le client']],rr:1})+fld(a,'liv',l.id,'link','Lien du fichier',l.link,{w2:1,ph:'https://drive.google.com/…'})+'</div>'+fld(a,'liv',l.id,'note','Note pour le client',l.note)+fb+
    '<div class="row"><a class="btn sm" target="_blank" rel="noopener noreferrer" href="'+esc(wa(a.client.tel,msgLiv(a,l))||'#')+'">Prévenir le client</a>'+(l.status==='doing'||l.status==='todo'?'<button class="btn sm line" data-act="liv-done" data-a="'+a.id+'" data-i="'+l.id+'">Marquer comme livré</button>':'')+'<button class="btn sm danger" data-act="del-liv" data-a="'+a.id+'" data-i="'+l.id+'">Supprimer</button></div></div>';}).join(''):'<div class="card empty">Aucun livrable.</div>');
}
function tabSat(a){
  var r=a.sat.resp,open=satOpen(a);
  var h='<div class="card"><h2>Questionnaire de satisfaction</h2>';
  if(r){
    var sc=satScore(r);
    h+='<div class="row"><div class="sc"><b>'+sc+'/10</b><span class="muted">note globale</span></div><span class="tag ok">reçu le '+esc(fd(r.date,true))+'</span></div><div class="grid g3" style="margin-top:12px"><div class="kpi"><b>'+r.q1+'/10</b><span>qualité de l’accompagnement</span></div><div class="kpi"><b>'+esc(r.q2)+'</b><span>délais respectés</span></div><div class="kpi"><b>'+r.q3+'/10</b><span>relation avec le consultant</span></div><div class="kpi"><b>'+r.q4+'/10</b><span>recommandation</span></div></div>'+
    (r.q5?'<h3 style="margin-top:14px">Ce qui a le plus aidé</h3><div class="quote">'+esc(r.q5)+'</div>':'')+(r.q6?'<h3>À améliorer</h3><div class="quote">'+esc(r.q6)+'</div>':'')+'<p>'+(r.q7?tag('ok','Témoignage autorisé'):tag('todo','Témoignage non autorisé'))+'</p><button class="btn sm danger" data-act="sat-reset" data-a="'+a.id+'">Effacer cette réponse</button>';
  }else if(open){
    h+='<p>Le questionnaire est <b>ouvert</b> dans l’espace client. Envoyez-lui le message ci-dessous, avec l’espace client à jour.</p><div class="row"><a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(wa(a.client.tel,msgSat(a))||'#')+'">Demander par WhatsApp</a><button class="btn line" data-act="client-dl" data-a="'+a.id+'">Télécharger l’espace client à jour</button></div>';

function field(el){
  var k=el.getAttribute('data-k'),f=el.getAttribute('data-f'),a=getAcc(el.getAttribute('data-a')),i=el.getAttribute('data-i'),v=el.type==='checkbox'?el.checked:el.value;
  if(k==='set'){S.settings[f]=v;save();return;}
  if(!a)return;
  var o=k==='client'?a.client:k==='acc'?a:k==='rdv'?a.rdv.filter(function(x){return x.id===i;})[0]:a.liv.filter(function(x){return x.id===i;})[0];
  if(!o)return;
  if(f==='dur')v=Math.max(5,parseInt(v,10)||60);
  var prev=o[f];o[f]=v;
  if(k==='liv'&&f==='status'&&v==='done'&&prev!=='done'){o.rev=(o.rev||0)+1;o.fb=null;}
  save();

document.addEventListener('click',function(e){

  if(act==='sat-reset'){a.sat.resp=null;save();render();return;}
  if(act==='del-acc'){confirmBox('Supprimer définitivement l’accompagnement de '+a.client.nom+' ?','del-acc-yes','data-a="'+a.id+'"');return;}
  if(act==='del-acc-yes'){if(a.espace&&a.espace.etat!=='révoqué'&&svcOn())svcPost({action:'revoke',token:a.espace.token}).catch(function(){});S.acc=S.acc.filter(function(x){return x.id!==aid;});save();ui.modal='';go('#/acc');render();toast('Accompagnement supprimé.');return;}
  if(act==='client-dl'){download('Espace_client_'+a.client.nom.replace(/[^A-Za-z0-9]+/g,'_')+'.html',clientHtml(a),'text/html');toast('Espace client téléchargé. Envoyez-le au client.');return;}
  if(act==='client-prev'){var ifr='<h2>Ce que voit le client</h2><iframe title="Aperçu de l’espace client"></iframe><div class="row" style="margin-top:12px"><button class="btn line" data-act="close">Fermer</button></div>';modal(ifr,true);var fr=$('.modal iframe');if(fr)fr.srcdoc=clientHtml(a);return;}
});
window.addEventListener('hashchange',function(){ui.modal='';render();window.scrollTo(0,0);});
try{unlocked=sessionStorage.getItem('gscAccOk')==='1';}catch(e){}
load();render();
window.addEventListener('focus',function(){if(svcOn()&&(!hasPin()||unlocked))pull(false);});
setInterval(function(){if(svcOn()&&!document.hidden&&(!hasPin()||unlocked))pull(false);},120000);
setTimeout(function(){if(svcOn()&&(!hasPin()||unlocked)){pull(false);queuePush();}},1200);
})();
</script></body></html>
